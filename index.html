<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CINQUE Studio - Diseñador Miyuki Profesional</title>
  <!-- Tipografía Moderna: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      /* Paleta Premium CINQUE */
      --bg-main: #121212;
      --bg-card: rgba(26, 26, 26, 0.85);
      --bg-card-hover: #222222;
      --accent-gold: #D4AF37;
      --gold-gradient: linear-gradient(135deg, #E6C665 0%, #B8860B 100%);
      --gold-soft: rgba(212, 175, 55, 0.15);
      --gold-border: rgba(212, 175, 55, 0.3);
      --text-primary: #F5F5F7;
      --text-muted: #A1A1A6;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --danger-color: #FF453A;
      --danger-soft: rgba(255, 69, 58, 0.15);
      --radius-lg: 16px;
      --radius-md: 10px;
      --radius-sm: 6px;
      --shadow-glow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

    body {
      background-color: var(--bg-main);
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(212, 175, 55, 0.05) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(212, 175, 55, 0.03) 0%, transparent 40%);
    }

    /* Header Elevado */
    header {
      background: rgba(18, 18, 18, 0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-subtle);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo-badge {
      width: 32px;
      height: 32px;
      background: var(--gold-gradient);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      font-weight: 800;
      font-size: 1.1rem;
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
    }

    header h1 {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: linear-gradient(180deg, #FFFFFF 0%, #A1A1A6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Layout Principal */
    .app-container {
      display: grid;
      grid-template-columns: 320px 1fr 320px;
      gap: 20px;
      padding: 20px;
      flex: 1;
    }

    @media (max-width: 1200px) {
      .app-container { grid-template-columns: 1fr; }
    }

    /* Tarjetas de Cristal Glassmorphism */
    .panel {
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: var(--radius-lg);
      padding: 20px;
      border: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      gap: 18px;
      box-shadow: var(--shadow-glow);
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 12px;
    }

    .panel-header h3 {
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* UI Controles */
    label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      margin-bottom: 6px;
      display: block;
    }

    select {
      width: 100%;
      background: #181818;
      color: var(--text-primary);
      border: 1px solid var(--border-subtle);
      padding: 10px 12px;
      border-radius: var(--radius-md);
      font-size: 0.85rem;
      outline: none;
      transition: all 0.2s;
    }

    select:focus {
      border-color: var(--accent-gold);
      box-shadow: 0 0 0 2px var(--gold-soft);
    }

    /* Botones Vanguardistas */
    button {
      cursor: pointer;
      border: none;
      padding: 10px 14px;
      border-radius: var(--radius-md);
      font-weight: 600;
      font-size: 0.8rem;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      outline: none;
    }

    .btn-gold {
      background: var(--gold-gradient);
      color: #000;
      font-weight: 700;
      box-shadow: 0 4px 12px rgba(212, 175, 55, 0.2);
    }

    .btn-gold:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(212, 175, 55, 0.35);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-primary);
      border: 1px solid var(--border-subtle);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .btn-secondary.active {
      background: var(--gold-soft);
      color: var(--accent-gold);
      border-color: var(--gold-border);
    }

    .btn-danger-outline {
      background: transparent;
      border: 1px solid var(--danger-color);
      color: var(--danger-color);
    }

    .btn-danger-outline:hover {
      background: var(--danger-soft);
    }

    button:disabled { opacity: 0.3; cursor: not-allowed; transform: none !important; }

    .icon-svg { width: 16px; height: 16px; fill: currentColor; }

    /* Grillas de Herramientas */
    .tool-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .action-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }

    /* Catálogo y Pestañas Minimalistas */
    .tab-container {
      display: flex;
      background: #181818;
      padding: 4px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-subtle);
    }

    .tab-btn {
      flex: 1;
      background: transparent;
      border: none;
      padding: 8px;
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      font-size: 0.75rem;
    }

    .tab-btn.active {
      background: var(--bg-card-hover);
      color: var(--text-primary);
      font-weight: 700;
    }

    .palette-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      max-height: 180px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .palette-grid::-webkit-scrollbar, .table-wrapper::-webkit-scrollbar {
      width: 4px;
    }

    .palette-grid::-webkit-scrollbar-thumb, .table-wrapper::-webkit-scrollbar-thumb {
      background: var(--border-subtle);
      border-radius: 4px;
    }

    .palette-item {
      aspect-ratio: 1;
      border-radius: var(--radius-sm);
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.2s;
      position: relative;
    }

    .palette-item.active {
      border-color: #FFFFFF;
      transform: scale(1.1);
      box-shadow: 0 0 10px rgba(255,255,255,0.5);
    }

    /* Área de Trabajo / Canvas */
    .canvas-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      padding: 24px;
      border: 1px solid var(--border-subtle);
      position: relative;
      overflow: auto;
    }

    .ruler-wrapper {
      display: grid;
      grid-template-columns: 30px 1fr;
      grid-template-rows: 24px 1fr;
      box-shadow: 0 12px 40px rgba(0,0,0,0.5);
      border-radius: var(--radius-md);
      overflow: hidden;
      border: 1px solid var(--border-subtle);
    }

    .ruler-corner { background: #181818; border-right: 1px solid var(--border-subtle); border-bottom: 1px solid var(--border-subtle); }
    
    .ruler-x {
      display: flex;
      background: #181818;
      border-bottom: 1px solid var(--border-subtle);
      overflow: hidden;
    }

    .ruler-y {
      display: flex;
      flex-direction: column;
      background: #181818;
      border-right: 1px solid var(--border-subtle);
      overflow: hidden;
    }

    .ruler-cell {
      font-size: 0.65rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
    }

    canvas {
      background: #1E1E1E;
      cursor: crosshair;
      touch-action: none;
    }

    /* Tarjetas de Resumen */
    .summary-card {
      background: var(--gold-soft);
      border: 1px solid var(--gold-border);
      padding: 14px;
      border-radius: var(--radius-md);
    }

    .summary-card p {
      font-size: 0.85rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
    }

    .summary-card span {
      color: var(--text-primary);
      font-weight: 700;
    }

    .table-wrapper {
      max-height: 240px;
      overflow-y: auto;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
    }

    .color-breakdown-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
    }

    .color-breakdown-table th {
      background: #181818;
      color: var(--text-muted);
      padding: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      text-align: left;
    }

    .color-breakdown-table td {
      padding: 10px;
      border-bottom: 1px solid var(--border-subtle);
      color: var(--text-primary);
    }

    .color-swatch {
      width: 16px;
      height: 16px;
      border-radius: 4px;
      border: 1px solid rgba(255,255,255,0.2);
    }

    /* Modales Rediseñados */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(8px);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000;
      opacity: 0; pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .modal-overlay.active { opacity: 1; pointer-events: auto; }

    .modal-container {
      background: #181818;
      border-radius: var(--radius-lg);
      padding: 28px;
      max-height: 90vh;
      display: flex; flex-direction: column;
      box-shadow: var(--shadow-glow);
      border: 1px solid var(--border-subtle);
    }

    .modal-lg { width: 90%; max-width: 900px; }
    .modal-md { width: 90%; max-width: 650px; }

    .modal-header {
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 16px; margin-bottom: 20px;
    }

    .modal-header h3 { font-size: 1.1rem; color: var(--text-primary); }

    .btn-close {
      background: transparent;
      font-size: 1.2rem;
      color: var(--text-muted);
      padding: 4px;
    }

    .btn-close:hover { color: var(--text-primary); }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
      overflow-y: auto;
      max-height: 55vh;
      padding: 4px;
    }

    .design-card {
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 12px;
      cursor: pointer;
      background: var(--bg-card);
      transition: all 0.2s ease;
    }

    .design-card:hover {
      border-color: var(--accent-gold);
      transform: translateY(-2px);
    }

    .card-thumbnail {
      width: 100%; height: 120px;
      background: #111;
      border-radius: var(--radius-sm);
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 10px;
      border: 1px solid var(--border-subtle);
    }

    .modal-body-split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-title">
      <div class="brand-logo-badge">C</div>
      <h1>Cinque Studio <span style="font-weight: 300; opacity: 0.5;">| Miyuki Designer</span></h1>
    </div>
    <button id="btnOpenGallery" class="btn-gold">
      <svg class="icon-svg" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14zm-5-7l-3 3.72L9 13l-3 4h12l-4-5z"/></svg>
      Mis Proyectos
    </button>
  </header>

  <main class="app-container">
    <!-- Panel Izquierdo: Herramientas -->
    <section class="panel">
      <div class="panel-header">
        <h3>
          <svg class="icon-svg" viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
          Herramientas
        </h3>
      </div>

      <div>
        <label>Tipo de Pieza</label>
        <select id="productSelect">
          <option value="pulsera">Pulsera Miyuki</option>
          <option value="anillo">Anillo</option>
          <option value="aretes">Aretes / Pendientes</option>
        </select>
      </div>

      <div>
        <label>Modo Edición</label>
        <div class="tool-grid">
          <button id="toolPencil" class="btn-secondary active" onclick="setTool('pencil')">
            <svg class="icon-svg" viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25z"/></svg>
            Pincel
          </button>
          <button id="toolBucket" class="btn-secondary" onclick="setTool('bucket')">
            <svg class="icon-svg" viewBox="0 0 24 24"><path d="M19 11.5s-2 2.17-2 3.5c0 1.1.9 2 2 2s2-.9 2-2c0-1.33-2-3.5-2-3.5zM16.56 8.94L7.62 0 6.21 1.41l2.38 2.38-5.15 5.15c-.59.59-.59 1.54 0 2.12l5.5 5.5c.29.29.68.44 1.06.44s.77-.15 1.06-.44l5.5-5.5c.59-.58.59-1.53 0-2.12z"/></svg>
            Balde
          </button>
          <button id="toolEraser" class="btn-secondary" onclick="setTool('eraser')">
            <svg class="icon-svg" viewBox="0 0 24 24"><path d="M15.14 3c-.51 0-1.02.2-1.41.59L2.59 14.73c-.78.78-.78 2.05 0 2.83L6.44 21.4c.39.39.9.59 1.41.59H19v-2h-5.56l7.13-7.13c.78-.78.78-2.05 0-2.83l-5.58-5.58c-.39-.39-.9-.59-1.42-.59z"/></svg>
            Borrar
          </button>
        </div>
      </div>

      <div>
        <label>Operaciones de Patrón</label>
        <div class="action-grid">
          <button class="btn-secondary" onclick="mirrorGrid('horizontal')">
            <svg class="icon-svg" viewBox="0 0 24 24"><path d="M6.99 11L3 15l3.99 4v-3H14v-2H6.99v-3zM21 9l-3.99-4v3H10v2h7.01v3L21 9z"/></svg>
            Espejo H
          </button>
          <button class="btn-secondary" onclick="mirrorGrid('vertical')">
            <svg class="icon-svg" viewBox="0 0 24 24"><path d="M16 17.01V10h-2v7.01h-3L15 21l4-3.99h-3zM9 3L5 6.99h3V14h2V6.99h3L9 3z"/></svg>
            Espejo V
          </button>
          <button class="btn-secondary" onclick="copyPattern()">
            <svg class="icon-svg" viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
            Copiar
          </button>
          <button class="btn-secondary" onclick="pastePattern()">
            <svg class="icon-svg" viewBox="0 0 24 24"><path d="M19 2h-4.18C14.4 1.84 13.3 1 12 1c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm7 18H5V4h2v3h10V4h2v16z"/></svg>
            Pegar
          </button>
        </div>
      </div>

      <div>
        <label>Historial</label>
        <div class="action-grid">
          <button id="btnUndo" class="btn-secondary" onclick="undo()" disabled>
            <svg class="icon-svg" viewBox="0 0 24 24"><path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/></svg>
            Deshacer
          </button>
          <button id="btnRedo" class="btn-secondary" onclick="redo()" disabled>
            <svg class="icon-svg" viewBox="0 0 24 24"><path d="M18.4 10.6C16.55 8.99 14.15 8 11.5 8c-4.65 0-8.58 3.03-9.96 7.22L3.9 16c1.05-3.19 4.05-5.5 7.6-5.5 1.95 0 3.73.72 5.12 1.88L13 16h9V7l-3.6 3.6z"/></svg>
            Rehacer
          </button>
        </div>
      </div>

      <div>
        <label>Catálogo Miyuki Oficial</label>
        <div class="tab-container" style="margin-bottom:10px;">
          <button id="tabDelica" class="tab-btn active" onclick="switchCatalog('delica')">Delica 11/0</button>
          <button id="tabRocalla" class="tab-btn" onclick="switchCatalog('rocalla')">Rocalla</button>
        </div>
        <div id="paletteContainer" class="palette-grid"></div>
        <div id="lblSelectedColor" style="font-size: 0.75rem; color:var(--text-muted); margin-top:8px; font-weight:600;"></div>
      </div>

      <button onclick="saveCurrentDesign()" class="btn-gold" style="margin-top: auto;">
        <svg class="icon-svg" viewBox="0 0 24 24"><path d="M17 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm-5 16c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm3-10H5V5h10v4z"/></svg>
        Guardar Proyecto
      </button>
    </section>

    <!-- Centro: Canvas de Edición -->
    <section class="canvas-container">
      <div class="ruler-wrapper">
        <div class="ruler-corner"></div>
        <div id="rulerX" class="ruler-x"></div>
        <div id="rulerY" class="ruler-y"></div>
        <canvas id="mainCanvas"></canvas>
      </div>
    </section>

    <!-- Panel Derecho: Resumen e Insumos -->
    <section class="panel">
      <div class="panel-header">
        <h3>
          <svg class="icon-svg" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
          Métricas
        </h3>
      </div>

      <div class="summary-card">
        <p>Cuentas Usadas: <span id="lblTotalBeads">0</span></p>
        <p style="margin-top:6px;">Costo Insumos Est.: <span id="lblEstimatedCost">$0.00</span></p>
      </div>

      <div style="flex:1;">
        <label>Desglose por Código</label>
        <div class="table-wrapper">
          <table class="color-breakdown-table">
            <thead>
              <tr><th>Color</th><th>Cód</th><th>Cant</th></tr>
            </thead>
            <tbody id="liveColorTable"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <!-- MODAL 1: Galería y Proyectos -->
  <div id="modalGallery" class="modal-overlay">
    <div class="modal-container modal-lg">
      <div class="modal-header">
        <h3>Mis Diseños</h3>
        <button class="btn-close" onclick="closeModal('modalGallery')">&times;</button>
      </div>

      <div style="display: flex; gap: 12px; margin-bottom: 20px;">
        <button onclick="createNewDesign()" class="btn-secondary">+ Nuevo Lienzo</button>
        <button id="btnImportFile" class="btn-gold">Importar JSON</button>
        <input type="file" id="fileInputJSON" accept=".json" style="display:none;">
      </div>

      <div id="galleryGrid" class="gallery-grid"></div>
    </div>
  </div>

  <!-- MODAL 2: Ficha Técnica -->
  <div id="modalDetail" class="modal-overlay">
    <div class="modal-container modal-md">
      <div class="modal-header">
        <h3 id="detailTitle">Detalle del Diseño</h3>
        <button class="btn-close" onclick="closeModal('modalDetail')">&times;</button>
      </div>

      <div class="modal-body-split">
        <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; background:#111; padding:16px; border-radius:var(--radius-md); border:1px solid var(--border-subtle);">
          <div id="detailCanvasContainer"></div>
        </div>

        <div>
          <label>Insumos Requeridos</label>
          <div class="table-wrapper">
            <table class="color-breakdown-table">
              <thead>
                <tr><th>Color</th><th>Código</th><th style="text-align:right;">Piezas</th></tr>
              </thead>
              <tbody id="colorBreakdownList"></tbody>
            </table>
          </div>
        </div>
      </div>

      <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border-subtle); padding-top: 16px;">
        <button id="btnDeleteDesign" class="btn-danger-outline" onclick="deleteSelectedDesign()">Eliminar</button>
        <div style="display:flex; gap:10px;">
          <button class="btn-secondary" onclick="exportSelectedJSON()">Exportar JSON</button>
          <button class="btn-gold" onclick="loadSelectedToCanvas()">Cargar en Lienzo</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // BASE DE DATOS INSUMOS
    const CATALOG_DELICA = [
      { code: 'DB-0200', name: 'Opaque Chalk White', hex: '#FFFFFF' },
      { code: 'DB-0310', name: 'Jet Black Mate', hex: '#1C1C1E' },
      { code: 'DB-0351', name: 'Blanco Mate', hex: '#E5E5EA' },
      { code: 'DB-0721', name: 'Opaque Yellow', hex: '#FFCC00' },
      { code: 'DB-0725', name: 'Opaque Light Blue', hex: '#64D2FF' },
      { code: 'DB-0726', name: 'Opaque Dark Blue', hex: '#0A84FF' },
      { code: 'DB-0727', name: 'Opaque Light Siam', hex: '#FF453A' },
      { code: 'DB-0734', name: 'Op Chocolate Brown', hex: '#633B2A' },
      { code: 'DB-0756', name: 'Matte Opaque Cobalt', hex: '#114B79' },
      { code: 'DB-0878', name: 'Mat Op Turquoise AB', hex: '#5ECCE6' },
      { code: 'DB-1493-1', name: 'Opaque Light Salmon', hex: '#FF9F0A' },
      { code: 'DB-1585', name: 'Matte Opaque Avocado', hex: '#30D158' },
      { code: 'DB-1832', name: 'Galvanized Gold Duracoat', hex: '#D4AF37' },
      { code: 'DB-2366-TB', name: 'Duracoat Opq Soft', hex: '#FFD60A' }
    ];

    const CATALOG_ROCALLA = [
      { code: '8-9402-TB', name: 'Rocalla 8/0 Op White', hex: '#F2F2F7' },
      { code: '8-9404-TB', name: 'Rocalla 8/0 Op Yellow', hex: '#FFD60A' },
      { code: '8-9408-TB', name: 'Rocalla 8/0 Op Red', hex: '#FF3B30' },
      { code: '8-9413F-TB', name: 'Rocalla 8/0 Seed Mat', hex: '#8E8E93' },
      { code: '8-9414-TB', name: 'Rocalla 8/0 Op Cobalt', hex: '#004080' },
      { code: '11-9401F-2TB', name: 'Rocalla 11/0 Matte Black', hex: '#000000' },
      { code: '11-92006-2TB', name: 'Rocalla 11/0 Mtlc Dark', hex: '#3A3A3C' },
      { code: '11-9593-2TB', name: 'Rocalla 11/0 Beige Ceylon', hex: '#E5D0AC' },
      { code: '11-9457L-2TB', name: 'Rocalla 11/0 Met Bronze', hex: '#8C6D58' }
    ];

    let rows = 20, cols = 35, beadSize = 18;
    let grid = [];
    let activeCatalog = CATALOG_DELICA;
    let selectedColor = CATALOG_DELICA[0];
    let currentTool = 'pencil';
    let isDrawing = false;
    let currentSelectedDesignIndex = null;
    let copiedPatternGrid = null;

    const historyStack = [];
    let historyIndex = -1;
    const MAX_HISTORY = 20;
    let renderPending = false;

    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');

    window.onload = () => {
      renderPalette();
      initGrid();
      setupEventListeners();
      saveState();
      requestRender();
    };

    function initGrid() {
      canvas.width = cols * beadSize;
      canvas.height = rows * beadSize;
      grid = Array(rows).fill(null).map(() => Array(cols).fill(null));
      renderRulers();
    }

    function renderRulers() {
      const rx = document.getElementById('rulerX');
      const ry = document.getElementById('rulerY');
      rx.innerHTML = ''; ry.innerHTML = '';
      rx.style.width = `${canvas.width}px`;
      ry.style.height = `${canvas.height}px`;

      for (let c = 0; c < cols; c++) {
        const cell = document.createElement('div');
        cell.className = 'ruler-cell';
        cell.style.width = `${beadSize}px`;
        cell.style.height = '100%';
        cell.textContent = (c + 1) % 5 === 0 || c === 0 ? c + 1 : '•';
        rx.appendChild(cell);
      }

      for (let r = 0; r < rows; r++) {
        const cell = document.createElement('div');
        cell.className = 'ruler-cell';
        cell.style.height = `${beadSize}px`;
        cell.style.width = '100%';
        cell.textContent = (r + 1) % 5 === 0 || r === 0 ? r + 1 : '•';
        ry.appendChild(cell);
      }
    }

    function switchCatalog(type) {
      document.getElementById('tabDelica').classList.toggle('active', type === 'delica');
      document.getElementById('tabRocalla').classList.toggle('active', type === 'rocalla');
      activeCatalog = (type === 'delica') ? CATALOG_DELICA : CATALOG_ROCALLA;
      selectedColor = activeCatalog[0];
      renderPalette();
    }

    function renderPalette() {
      const container = document.getElementById('paletteContainer');
      container.innerHTML = '';
      activeCatalog.forEach((color) => {
        const div = document.createElement('div');
        div.className = `palette-item ${color.code === selectedColor.code ? 'active' : ''}`;
        div.style.backgroundColor = color.hex;
        div.title = `${color.code} - ${color.name}`;
        div.onclick = () => {
          document.querySelectorAll('.palette-item').forEach(el => el.classList.remove('active'));
          div.classList.add('active');
          selectedColor = color;
          updateSelectedColorLabel();
        };
        container.appendChild(div);
      });
      updateSelectedColorLabel();
    }

    function updateSelectedColorLabel() {
      document.getElementById('lblSelectedColor').textContent = `Sel: ${selectedColor.code} - ${selectedColor.name}`;
    }

    function requestRender() {
      if (!renderPending) {
        renderPending = true;
        requestAnimationFrame(() => {
          draw();
          renderPending = false;
        });
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const x = c * beadSize;
          const y = r * beadSize;

          if (grid[r][c]) {
            ctx.fillStyle = grid[r][c].hex;
            ctx.beginPath();
            ctx.roundRect(x + 1, y + 1, beadSize - 2, beadSize - 2, 3);
            ctx.fill();
          } else {
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
            ctx.strokeRect(x, y, beadSize, beadSize);
          }
        }
      }
    }

    function applyBead(r, c) {
      if (r >= 0 && r < rows && c >= 0 && c < cols) {
        if (currentTool === 'pencil') grid[r][c] = selectedColor;
        else if (currentTool === 'eraser') grid[r][c] = null;
      }
    }

    function floodFill(r, c, targetHex, replacementColor) {
      if (r < 0 || r >= rows || c < 0 || c >= cols) return;
      const currentHex = grid[r][c] ? grid[r][c].hex : null;
      if (currentHex === targetHex) return;

      const stack = [[r, c]];
      while (stack.length) {
        const [currR, currC] = stack.pop();
        if (currR < 0 || currR >= rows || currC < 0 || currC >= cols) continue;

        const cellHex = grid[currR][currC] ? grid[currR][currC].hex : null;
        if (cellHex === targetHex) {
          grid[currR][currC] = replacementColor;
          stack.push([currR + 1, currC], [currR - 1, currC], [currR, currC + 1], [currR, currC - 1]);
        }
      }
    }

    function mirrorGrid(type) {
      saveState();
      if (type === 'horizontal') grid = grid.map(row => [...row].reverse());
      else if (type === 'vertical') grid.reverse();
      requestRender();
      updateCalculations();
    }

    function copyPattern() {
      copiedPatternGrid = JSON.parse(JSON.stringify(grid));
      alert('Patrón copiado.');
    }

    function pastePattern() {
      if (!copiedPatternGrid) return;
      saveState();
      grid = JSON.parse(JSON.stringify(copiedPatternGrid));
      requestRender();
      updateCalculations();
    }

    function setupEventListeners() {
      canvas.addEventListener('pointerdown', e => {
        saveState();
        isDrawing = true;
        const coords = getBeadCoords(e);

        if (currentTool === 'bucket') {
          const targetHex = grid[coords.r][coords.c] ? grid[coords.r][coords.c].hex : null;
          floodFill(coords.r, coords.c, targetHex, selectedColor);
        } else {
          applyBead(coords.r, coords.c);
        }
        requestRender();
      });

      canvas.addEventListener('pointermove', e => {
        if (!isDrawing) return;
        const coords = getBeadCoords(e);
        if (currentTool === 'pencil' || currentTool === 'eraser') {
          applyBead(coords.r, coords.c);
        }
        requestRender();
      });

      window.addEventListener('pointerup', () => {
        if (isDrawing) {
          isDrawing = false;
          updateCalculations();
        }
      });
    }

    function getBeadCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      return {
        r: Math.floor(y / beadSize),
        c: Math.floor(x / beadSize)
      };
    }

    function setTool(tool) {
      currentTool = tool;
      document.querySelectorAll('.tool-grid button').forEach(btn => btn.classList.remove('active'));
      if (tool === 'pencil') document.getElementById('toolPencil').classList.add('active');
      if (tool === 'bucket') document.getElementById('toolBucket').classList.add('active');
      if (tool === 'eraser') document.getElementById('toolEraser').classList.add('active');
    }

    function saveState() {
      if (historyIndex < historyStack.length - 1) historyStack.splice(historyIndex + 1);
      historyStack.push(JSON.parse(JSON.stringify(grid)));
      if (historyStack.length > MAX_HISTORY) historyStack.shift();
      else historyIndex++;
      updateUndoRedoButtons();
    }

    function undo() {
      if (historyIndex > 0) {
        historyIndex--;
        grid = JSON.parse(JSON.stringify(historyStack[historyIndex]));
        requestRender();
        updateCalculations();
        updateUndoRedoButtons();
      }
    }

    function redo() {
      if (historyIndex < historyStack.length - 1) {
        historyIndex++;
        grid = JSON.parse(JSON.stringify(historyStack[historyIndex]));
        requestRender();
        updateCalculations();
        updateUndoRedoButtons();
      }
    }

    function updateUndoRedoButtons() {
      document.getElementById('btnUndo').disabled = (historyIndex <= 0);
      document.getElementById('btnRedo').disabled = (historyIndex >= historyStack.length - 1);
    }

    function updateCalculations() {
      const colorCounts = {};
      let totalBeads = 0;

      grid.forEach(row => {
        row.forEach(bead => {
          if (bead) {
            totalBeads++;
            if (!colorCounts[bead.code]) colorCounts[bead.code] = { ...bead, count: 0 };
            colorCounts[bead.code].count++;
          }
        });
      });

      document.getElementById('lblTotalBeads').textContent = totalBeads;
      document.getElementById('lblEstimatedCost').textContent = `$${(totalBeads * 0.03).toFixed(2)}`;

      const tableBody = document.getElementById('liveColorTable');
      tableBody.innerHTML = '';
      Object.values(colorCounts).forEach(item => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><div class="color-swatch" style="background:${item.hex};"></div></td>
          <td><strong>${item.code}</strong></td>
          <td>${item.count}</td>
        `;
        tableBody.appendChild(tr);
      });
    }

    function getSavedDesigns() {
      return JSON.parse(localStorage.getItem('cinque_saved_designs') || '[]');
    }

    function saveCurrentDesign() {
      const name = prompt('Nombre del diseño:', 'Nuevo Diseño CINQUE');
      if (!name) return;

      const designs = getSavedDesigns();
      designs.unshift({
        name,
        product: document.getElementById('productSelect').value,
        grid: JSON.parse(JSON.stringify(grid)),
        createdAt: new Date().toISOString()
      });

      localStorage.setItem('cinque_saved_designs', JSON.stringify(designs));
      alert('Proyecto Guardado');
    }

    document.getElementById('btnOpenGallery').onclick = () => {
      renderGallery();
      openModal('modalGallery');
    };

    function renderGallery() {
      const gridContainer = document.getElementById('galleryGrid');
      gridContainer.innerHTML = '';
      const designs = getSavedDesigns();

      if (designs.length === 0) {
        gridContainer.innerHTML = `<div style="grid-column: 1/-1; text-align:center; padding: 40px; color:var(--text-muted);">Sin diseños guardados.</div>`;
        return;
      }

      designs.forEach((design, index) => {
        const card = document.createElement('div');
        card.className = 'design-card';
        card.onclick = () => openDetailModal(index);
        card.innerHTML = `
          <div class="card-thumbnail" id="thumb-${index}"></div>
          <div style="font-weight:700; font-size:0.85rem; color:var(--text-primary);">${design.name}</div>
          <div style="font-size:0.7rem; color:var(--text-muted); text-transform:uppercase;">${design.product}</div>
        `;
        gridContainer.appendChild(card);
        setTimeout(() => renderThumbnail(`thumb-${index}`, design.grid), 0);
      });
    }

    function renderThumbnail(containerId, designGrid) {
      const container = document.getElementById(containerId);
      if (!container || !designGrid) return;
      container.innerHTML = '';

      const canvasThumb = document.createElement('canvas');
      const rCount = designGrid.length;
      const cCount = designGrid[0].length;
      const tSize = Math.min(100 / cCount, 100 / rCount, 5);

      canvasThumb.width = cCount * tSize;
      canvasThumb.height = rCount * tSize;
      const tCtx = canvasThumb.getContext('2d');

      for (let r = 0; r < rCount; r++) {
        for (let c = 0; c < cCount; c++) {
          if (designGrid[r][c]) {
            tCtx.fillStyle = designGrid[r][c].hex;
            tCtx.fillRect(c * tSize, r * tSize, tSize, tSize);
          }
        }
      }
      container.appendChild(canvasThumb);
    }

    function openDetailModal(index) {
      currentSelectedDesignIndex = index;
      const design = getSavedDesigns()[index];
      document.getElementById('detailTitle').textContent = design.name;

      const colorCounts = {};
      design.grid.forEach(row => {
        row.forEach(bead => {
          if (bead) {
            if (!colorCounts[bead.code]) colorCounts[bead.code] = { ...bead, count: 0 };
            colorCounts[bead.code].count++;
          }
        });
      });

      const list = document.getElementById('colorBreakdownList');
      list.innerHTML = '';
      Object.values(colorCounts).forEach(item => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><div class="color-swatch" style="background:${item.hex};"></div></td>
          <td><strong>${item.code}</strong></td>
          <td style="text-align:right;"><strong>${item.count}</strong></td>
        `;
        list.appendChild(tr);
      });

      renderThumbnail('detailCanvasContainer', design.grid);
      closeModal('modalGallery');
      openModal('modalDetail');
    }

    function loadSelectedToCanvas() {
      const design = getSavedDesigns()[currentSelectedDesignIndex];
      if (design) {
        grid = JSON.parse(JSON.stringify(design.grid));
        document.getElementById('productSelect').value = design.product;
        saveState();
        requestRender();
        updateCalculations();
        closeModal('modalDetail');
      }
    }

    function deleteSelectedDesign() {
      if (confirm('¿Eliminar este diseño?')) {
        const designs = getSavedDesigns();
        designs.splice(currentSelectedDesignIndex, 1);
        localStorage.setItem('cinque_saved_designs', JSON.stringify(designs));
        closeModal('modalDetail');
        renderGallery();
        openModal('modalGallery');
      }
    }

    function createNewDesign() {
      initGrid();
      saveState();
      requestRender();
      updateCalculations();
      closeModal('modalGallery');
    }

    function exportSelectedJSON() {
      const design = getSavedDesigns()[currentSelectedDesignIndex];
      const blob = new Blob([JSON.stringify(design, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `${design.name}.json`;
      a.click();
    }

    document.getElementById('btnImportFile').onclick = () => document.getElementById('fileInputJSON').click();

    document.getElementById('fileInputJSON').onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (evt) => {
        try {
          const imported = JSON.parse(evt.target.result);
          if (imported.grid) {
            const designs = getSavedDesigns();
            designs.unshift(imported);
            localStorage.setItem('cinque_saved_designs', JSON.stringify(designs));
            renderGallery();
            alert('¡Diseño importado!');
          }
        } catch (err) {
          alert('Error al leer el JSON.');
        }
      };
      reader.readAsText(file);
    };

    function openModal(id) { document.getElementById(id).classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }
  </script>
</body>
</html>
