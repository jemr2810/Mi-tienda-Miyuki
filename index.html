<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miyuki Craft Studio Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0f1117;
            --panel-bg: rgba(22, 25, 35, 0.85);
            --panel-border: rgba(255, 255, 255, 0.08);
            --accent: #6c5ce7;
            --accent-glow: rgba(108, 92, 231, 0.4);
            --success: #00b894;
            --text-main: #f1f2f6;
            --text-muted: #a4b0be;
            --radius-lg: 16px;
            --radius-md: 10px;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            padding: 20px;
            background-color: var(--bg-main);
            background-image: radial-gradient(circle at 50% 0%, #1e1b4b 0%, var(--bg-main) 70%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            font-size: 1.8rem;
            font-weight: 800;
            margin: 0;
            background: linear-gradient(135deg, #a8c0ff, #3f2b96);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-top: 4px;
        }

        .app-layout {
            display: grid;
            grid-template-columns: 300px 1fr 300px;
            gap: 20px;
            max-width: 1400px;
            width: 100%;
        }

        /* Glassmorphic Panels */
        .panel {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--panel-border);
            border-radius: var(--radius-lg);
            padding: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .panel-title {
            font-size: 0.95rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
            margin: 0 0 5px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Form Controls */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        select, input[type="text"], input[type="number"], input[type="color"] {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--panel-border);
            color: var(--text-main);
            padding: 10px;
            border-radius: var(--radius-md);
            font-family: inherit;
            font-size: 0.85rem;
            outline: none;
            transition: all 0.2s;
        }

        select:focus, input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        /* Canvas Arena */
        .viewport-container {
            position: relative;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--panel-border);
            border-radius: var(--radius-lg);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: auto;
            min-height: 500px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }

        canvas {
            border-radius: 6px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
            cursor: crosshair;
            touch-action: none;
        }

        /* Tool Grid / Dock */
        .tools-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .btn-tool {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--panel-border);
            color: var(--text-main);
            padding: 10px;
            border-radius: var(--radius-md);
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-tool:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        .btn-tool.tool-active {
            background: var(--accent);
            border-color: var(--accent);
            box-shadow: 0 0 15px var(--accent-glow);
            color: #fff;
        }

        .btn-tool.mirror-active {
            background: #e67e22;
            border-color: #e67e22;
        }

        .btn-tool:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* Palette Swatches */
        .palette-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(38px, 1fr));
            gap: 6px;
            max-height: 140px;
            overflow-y: auto;
            padding: 4px;
        }

        .color-swatch {
            aspect-ratio: 1;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: transform 0.15s, border-color 0.15s;
            position: relative;
        }

        .color-swatch:hover {
            transform: scale(1.15);
            z-index: 2;
        }

        .color-swatch.selected {
            border-color: #fff;
            transform: scale(1.1);
            box-shadow: 0 0 10px rgba(255,255,255,0.5);
        }

        /* Price & Summary Tag */
        .price-badge {
            background: linear-gradient(135deg, #00b894, #00cec9);
            padding: 15px;
            border-radius: var(--radius-md);
            text-align: center;
            color: #000;
        }

        .price-badge label {
            color: rgba(0,0,0,0.6);
            font-weight: 800;
        }

        .price-badge .price {
            font-size: 1.8rem;
            font-weight: 800;
            margin-top: 2px;
        }

        .btn-action {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: var(--radius-md);
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
        }

        .btn-action:hover {
            opacity: 0.9;
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        .btn-whatsapp {
            background: #00b894;
            color: #fff;
        }

        .design-item {
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--panel-border);
            padding: 8px 12px;
            border-radius: var(--radius-md);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            margin-bottom: 6px;
        }

        /* Responsive Layout */
        @media (max-width: 1024px) {
            .app-layout { grid-template-columns: 1fr; }
            .viewport-container { min-height: 380px; }
        }
    </style>
</head>
<body>

    <header>
        <h1>MIYUKI CRAFT STUDIO</h1>
        <p>Editor de Patrones 2D Pro</p>
    </header>

    <div class="app-layout">
        <!-- Panel Izquierdo: Configuración y Herramientas -->
        <div class="panel">
            <h3 class="panel-title">⚙️ Configuración</h3>
            
            <div class="form-group">
                <label>Producto</label>
                <select id="productSelect">
                    <option value="anillo">Anillo (6x50)</option>
                    <option value="pulsera" selected>Pulsera (16x100)</option>
                    <option value="dije">Dije / Parche (25x25)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Técnica de Tejido</label>
                <select id="techniqueSelect">
                    <option value="loom">Loom (Telar Recto)</option>
                    <option value="peyote">Peyote (Intercalado Horiz.)</option>
                    <option value="brick">Brick (Intercalado Vert.)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Plantilla Silueta</label>
                <select id="templateSelect">
                    <option value="none">-- Sin Plantilla --</option>
                    <option value="diamond">Diamante / Rombo</option>
                    <option value="chevron">Zig-Zag (Chevron)</option>
                    <option value="flower">Flor (8 Pétalos)</option>
                    <option value="heart">Corazón</option>
                </select>
            </div>

            <h3 class="panel-title" style="margin-top:10px;">🛠️ Herramientas</h3>
            <div class="tools-grid">
                <button id="btnPencil" class="btn-tool tool-active">✏️ Lápiz</button>
                <button id="btnBucket" class="btn-tool">🪣 Relleno</button>
                <button id="btnEraser" class="btn-tool">🧹 Borrar</button>
                <button id="btnSelect" class="btn-tool">🔳 Seleccionar</button>
                <button id="btnCopy" class="btn-tool" disabled>📋 Copiar</button>
                <button id="btnPaste" class="btn-tool" disabled>📌 Pegar</button>
                <button id="btnMirrorH" class="btn-tool" disabled>🪞 Espejo H</button>
                <button id="btnMirrorV" class="btn-tool" disabled>↕️ Espejo V</button>
            </div>
            <button id="btnClear" class="btn-tool" style="background: rgba(231, 76, 60, 0.2); border-color: rgba(231, 76, 60, 0.4); color:#e74c3c;">🗑️ Limpiar Todo</button>
        </div>

        <!-- Panel Central: Lienzo de Trabajo -->
        <div class="viewport-container">
            <canvas id="miyukiCanvas"></canvas>
        </div>

        <!-- Panel Derecho: Catálogo, Biblioteca y Cotización -->
        <div class="panel">
            <h3 class="panel-title">🎨 Paleta en Stock</h3>
            <div class="palette-grid" id="paletteContainer"></div>
            <span id="selectedColorLabel" style="font-size:0.75rem; font-weight:600; color:var(--text-muted);"></span>

            <h3 class="panel-title" style="margin-top: 10px;">📁 Biblioteca</h3>
            <div class="form-group">
                <input type="text" id="designName" placeholder="Nombre del diseño...">
            </div>
            <button id="btnSaveDesign" class="btn-action" style="background: rgba(255,255,255,0.08);">💾 Guardar Diseño</button>
            <div id="savedDesignsList" style="max-height: 120px; overflow-y: auto;"></div>

            <div class="price-badge">
                <label>COSTO ESTIMADO</label>
                <div class="price" id="totalPrice">$0.00</div>
                <div style="font-size:0.75rem; margin-top:2px;">Total Cuentas: <strong id="totalBeads">0</strong></div>
            </div>

            <button class="btn-action btn-whatsapp" id="btnSendWhatsapp">📲 Pedir por WhatsApp</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('miyukiCanvas');
        const ctx = canvas.getContext('2d');

        const DEFAULT_PALETTE = [
            { code: "DB0351", name: "Blanco mate", hex: "#F8F9FA", price: 0.01 },
            { code: "DB1493-1", name: "Opaque Lt Salmon", hex: "#FFA089", price: 0.01 },
            { code: "DB0734", name: "Op Chocolate Brown", hex: "#4A2E2B", price: 0.01 },
            { code: "DB0878", name: "Mat Op Turquoise AB", hex: "#30D5C8", price: 0.01 },
            { code: "DB0756", name: "Matte Op Cobalt", hex: "#0038A8", price: 0.01 },
            { code: "DB0310", name: "Jet Black Mate", hex: "#1A1A1A", price: 0.01 },
            { code: "DB2366-TB", name: "Duracoat Opq Soft", hex: "#E6C280", price: 0.015 },
            { code: "DB1585", name: "Matte Op Avocado", hex: "#568203", price: 0.01 },
            { code: "11-9401F", name: "Rocalla Mat Black", hex: "#121212", price: 0.008 },
            { code: "11-92006", name: "Rocalla Mat Mtlc Dk", hex: "#4A4A4A", price: 0.008 },
            { code: "11-9402", name: "Rocalla Op White", hex: "#FFFFFF", price: 0.008 },
            { code: "11-9408", name: "Rocalla Op Red", hex: "#D32F2F", price: 0.008 },
            { code: "11-9404", name: "Rocalla Op Yellow", hex: "#FBC02D", price: 0.008 },
            { code: "11-9593", name: "Rocalla Dk Beige", hex: "#D7BDE2", price: 0.008 },
            { code: "11-9457L", name: "Rocalla Met Bronze", hex: "#8C6239", price: 0.009 },
            { code: "DB0721", name: "Opaque Yellow", hex: "#FFD700", price: 0.01 },
            { code: "DB0200", name: "Opaque Chalk White", hex: "#FFFFFF", price: 0.01 },
            { code: "DB1832", name: "Galvanized Gold", hex: "#D4AF37", price: 0.018 },
            { code: "DB0726", name: "Opaque Dark Blue", hex: "#002366", price: 0.01 },
            { code: "DB0727", name: "Opaque Light Siam", hex: "#E32636", price: 0.01 },
            { code: "DB0725", name: "Opaque Light Blue", hex: "#87CEEB", price: 0.01 }
        ];

        let palette = JSON.parse(localStorage.getItem('miyuki_palette')) || DEFAULT_PALETTE;
        let selectedColor = palette[0];
        let currentTool = 'pencil';
        let cols = 100, rows = 16, beadSize = 14;
        let grid = [];
        let isDrawing = false;

        let selectionStart = null;
        let selectionEnd = null;
        let clipboard = null;
        let mirrorH = false;
        let mirrorV = false;

        const COSTS = { baseProducts: { anillo: 1.5, pulsera: 3.0, dije: 2.0 } };
        const PRODUCT_SIZES = {
            anillo: { cols: 50, rows: 6 },
            pulsera: { cols: 100, rows: 16 },
            dije: { cols: 25, rows: 25 }
        };

        function renderPalette() {
            const container = document.getElementById('paletteContainer');
            container.innerHTML = '';
            palette.forEach((item) => {
                const swatch = document.createElement('div');
                swatch.className = `color-swatch ${item.code === selectedColor.code ? 'selected' : ''}`;
                swatch.style.backgroundColor = item.hex;
                swatch.title = `${item.code} - ${item.name}`;
                swatch.onclick = () => {
                    selectedColor = item;
                    document.getElementById('selectedColorLabel').textContent = `${item.code} - ${item.name}`;
                    renderPalette();
                };
                container.appendChild(swatch);
            });
            document.getElementById('selectedColorLabel').textContent = `${selectedColor.code} - ${selectedColor.name}`;
        }

        function initGrid() {
            const product = document.getElementById('productSelect').value;
            const technique = document.getElementById('techniqueSelect').value;
            cols = PRODUCT_SIZES[product].cols;
            rows = PRODUCT_SIZES[product].rows;

            canvas.width = cols * beadSize + (technique === 'peyote' ? beadSize / 2 : 0);
            canvas.height = rows * beadSize + (technique === 'brick' ? beadSize / 2 : 0);

            grid = Array(rows).fill(null).map(() => Array(cols).fill(null));
            selectionStart = null;
            selectionEnd = null;
            draw();
            updateCalculations();
        }

        function getBeadCoords(x, y) {
            const technique = document.getElementById('techniqueSelect').value;
            let r, c;

            if (technique === 'brick') {
                c = Math.floor(x / beadSize);
                let offsetY = (c % 2 !== 0) ? beadSize / 2 : 0;
                r = Math.floor((y - offsetY) / beadSize);
            } else if (technique === 'peyote') {
                r = Math.floor(y / beadSize);
                let offsetX = (r % 2 !== 0) ? beadSize / 2 : 0;
                c = Math.floor((x - offsetX) / beadSize);
            } else {
                r = Math.floor(y / beadSize);
                c = Math.floor(x / beadSize);
            }
            return { r, c };
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const technique = document.getElementById('techniqueSelect').value;

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    let x = c * beadSize;
                    let y = r * beadSize;

                    if (technique === 'peyote' && r % 2 !== 0) x += beadSize / 2;
                    if (technique === 'brick' && c % 2 !== 0) y += beadSize / 2;

                    ctx.beginPath();
                    ctx.roundRect(x, y, beadSize - 1.5, beadSize - 1.5, 3);

                    if (grid[r][c]) {
                        ctx.fillStyle = grid[r][c].hex;
                        ctx.fill();
                    } else {
                        ctx.fillStyle = 'rgba(255, 255, 255, 0.03)';
                        ctx.fill();
                        ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
                        ctx.stroke();
                    }
                }
            }

            if (selectionStart && selectionEnd) {
                const minR = Math.min(selectionStart.r, selectionEnd.r);
                const maxR = Math.max(selectionStart.r, selectionEnd.r);
                const minC = Math.min(selectionStart.c, selectionEnd.c);
                const maxC = Math.max(selectionStart.c, selectionEnd.c);

                const x = minC * beadSize;
                const y = minR * beadSize;
                const w = (maxC - minC + 1) * beadSize;
                const h = (maxR - minR + 1) * beadSize;

                ctx.strokeStyle = '#6c5ce7';
                ctx.lineWidth = 2;
                ctx.setLineDash([4, 4]);
                ctx.strokeRect(x, y, w, h);
                ctx.fillStyle = 'rgba(108, 92, 231, 0.2)';
                ctx.fillRect(x, y, w, h);
                ctx.setLineDash([]);
            }
        }

        function floodFill(r, c, targetColor) {
            if (r < 0 || r >= rows || c < 0 || c >= cols) return;
            const currentColor = grid[r][c];
            if (currentColor === targetColor) return;

            function fill(x, y) {
                if (x < 0 || x >= rows || y < 0 || y >= cols) return;
                if (grid[x][y] !== currentColor) return;
                grid[x][y] = targetColor;

                fill(x + 1, y);
                fill(x - 1, y);
                fill(x, y + 1);
                fill(x, y - 1);
            }
            fill(r, c);
        }

        function handlePointerDown(e) {
            isDrawing = true;
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            const coords = getBeadCoords(clientX - rect.left, clientY - rect.top);

            if (coords.r >= 0 && coords.r < rows && coords.c >= 0 && coords.c < cols) {
                if (currentTool === 'select') {
                    selectionStart = coords;
                    selectionEnd = coords;
                    document.getElementById('btnCopy').disabled = false;
                } else if (currentTool === 'paste' && clipboard) {
                    pasteClipboard(coords.r, coords.c);
                } else if (currentTool === 'pencil') {
                    grid[coords.r][coords.c] = selectedColor;
                } else if (currentTool === 'eraser') {
                    grid[coords.r][coords.c] = null;
                } else if (currentTool === 'bucket') {
                    floodFill(coords.r, coords.c, selectedColor);
                }
                draw();
                updateCalculations();
            }
        }

        function handlePointerMove(e) {
            if (!isDrawing) return;
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            const coords = getBeadCoords(clientX - rect.left, clientY - rect.top);

            if (coords.r >= 0 && coords.r < rows && coords.c >= 0 && coords.c < cols) {
                if (currentTool === 'select') {
                    selectionEnd = coords;
                } else if (currentTool === 'pencil') {
                    grid[coords.r][coords.c] = selectedColor;
                } else if (currentTool === 'eraser') {
                    grid[coords.r][coords.c] = null;
                }
                draw();
                updateCalculations();
            }
        }

        function copySelectedArea() {
            if (!selectionStart || !selectionEnd) return;
            const minR = Math.min(selectionStart.r, selectionEnd.r);
            const maxR = Math.max(selectionStart.r, selectionEnd.r);
            const minC = Math.min(selectionStart.c, selectionEnd.c);
            const maxC = Math.max(selectionStart.c, selectionEnd.c);

            clipboard = [];
            for (let r = minR; r <= maxR; r++) {
                let row = [];
                for (let c = minC; c <= maxC; c++) {
                    row.push(grid[r][c]);
                }
                clipboard.push(row);
            }
            document.getElementById('btnPaste').disabled = false;
            document.getElementById('btnMirrorH').disabled = false;
            document.getElementById('btnMirrorV').disabled = false;
        }

        function pasteClipboard(startR, startC) {
            if (!clipboard) return;
            let clipRows = clipboard.length;
            let clipCols = clipboard[0].length;

            for (let r = 0; r < clipRows; r++) {
                for (let c = 0; c < clipCols; c++) {
                    let sourceR = mirrorV ? (clipRows - 1 - r) : r;
                    let sourceC = mirrorH ? (clipCols - 1 - c) : c;

                    let targetR = startR + r;
                    let targetC = startC + c;

                    if (targetR < rows && targetC < cols) {
                        grid[targetR][targetC] = clipboard[sourceR][sourceC];
                    }
                }
            }
        }

        function applyTemplate(type) {
            if (type === 'none') return;
            const midR = Math.floor(rows / 2);
            const midC = Math.floor(cols / 2);

            grid = Array(rows).fill(null).map(() => Array(cols).fill(null));

            if (type === 'diamond') {
                const size = Math.min(midR, midC) - 1;
                for (let i = 0; i <= size; i++) {
                    if (midR - i >= 0 && midC - i >= 0) grid[midR - i][midC - i] = selectedColor;
                    if (midR - i >= 0 && midC + i < cols) grid[midR - i][midC + i] = selectedColor;
                    if (midR + i < rows && midC - i >= 0) grid[midR + i][midC - i] = selectedColor;
                    if (midR + i < rows && midC + i < cols) grid[midR + i][midC + i] = selectedColor;
                }
            } else if (type === 'chevron') {
                for (let c = 0; c < cols; c++) {
                    let r = midR + (c % 6 < 3 ? (c % 3) : (2 - (c % 3))) - 1;
                    if (r >= 0 && r < rows) grid[r][c] = selectedColor;
                }
            } else if (type === 'flower') {
                const offsets = [[-2,0], [-2,1], [-1,2], [0,2], [1,2], [2,1], [2,0], [2,-1], [1,-2], [0,-2], [-1,-2], [-2,-1]];
                offsets.forEach(([dr, dc]) => {
                    if (midR + dr >= 0 && midR + dr < rows && midC + dc >= 0 && midC + dc < cols) grid[midR + dr][midC + dc] = selectedColor;
                });
            } else if (type === 'heart') {
                const heartCoords = [[-2,-1], [-2,1], [-3,-2], [-3,2], [-2,-3], [-2,3], [-1,-3], [-1,3], [0,-2], [0,2], [1,-1], [1,1], [2,0]];
                heartCoords.forEach(([dr, dc]) => {
                    if (midR + dr >= 0 && midR + dr < rows && midC + dc >= 0 && midC + dc < cols) grid[midR + dr][midC + dc] = selectedColor;
                });
            }

            draw();
            updateCalculations();
        }

        function saveDesign() {
            const nameInput = document.getElementById('designName');
            const name = nameInput.value.trim();
            if (!name) return;

            let designs = JSON.parse(localStorage.getItem('miyuki_saved_designs')) || {};
            designs[name] = {
                product: document.getElementById('productSelect').value,
                technique: document.getElementById('techniqueSelect').value,
                grid: grid
            };

            localStorage.setItem('miyuki_saved_designs', JSON.stringify(designs));
            nameInput.value = '';
            renderSavedDesigns();
        }

        function loadDesign(name) {
            let designs = JSON.parse(localStorage.getItem('miyuki_saved_designs')) || {};
            const design = designs[name];
            if (design) {
                document.getElementById('productSelect').value = design.product;
                document.getElementById('techniqueSelect').value = design.technique;
                initGrid();
                grid = design.grid;
                draw();
                updateCalculations();
            }
        }

        function deleteDesign(name) {
            let designs = JSON.parse(localStorage.getItem('miyuki_saved_designs')) || {};
            delete designs[name];
            localStorage.setItem('miyuki_saved_designs', JSON.stringify(designs));
            renderSavedDesigns();
        }

        function renderSavedDesigns() {
            const container = document.getElementById('savedDesignsList');
            let designs = JSON.parse(localStorage.getItem('miyuki_saved_designs')) || {};
            const keys = Object.keys(designs);

            if (keys.length === 0) {
                container.innerHTML = '<span style="font-size:0.75rem; color:var(--text-muted);">Sin diseños guardados.</span>';
                return;
            }

            container.innerHTML = '';
            keys.forEach(name => {
                const item = document.createElement('div');
                item.className = 'design-item';
                item.innerHTML = `
                    <span>${name}</span>
                    <div>
                        <button style="background:var(--accent); border:none; color:#fff; border-radius:4px; padding:2px 6px; cursor:pointer;" onclick="loadDesign('${name}')">📂</button>
                        <button style="background:#e74c3c; border:none; color:#fff; border-radius:4px; padding:2px 6px; cursor:pointer;" onclick="deleteDesign('${name}')">🗑️</button>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        function updateCalculations() {
            let totalBeads = 0;
            let totalPrice = 0;

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    let bead = grid[r][c];
                    if (bead) {
                        totalBeads++;
                        totalPrice += bead.price;
                    }
                }
            }

            const product = document.getElementById('productSelect').value;
            totalPrice += COSTS.baseProducts[product] || 0;

            document.getElementById('totalBeads').textContent = totalBeads;
            document.getElementById('totalPrice').textContent = `$${totalPrice.toFixed(2)}`;
        }

        canvas.addEventListener('mousedown', handlePointerDown);
        canvas.addEventListener('mousemove', handlePointerMove);
        window.addEventListener('mouseup', () => isDrawing = false);

        canvas.addEventListener('touchstart', (e) => { handlePointerDown(e); e.preventDefault(); });
        canvas.addEventListener('touchmove', (e) => { handlePointerMove(e); e.preventDefault(); });
        window.addEventListener('touchend', () => isDrawing = false);

        document.getElementById('productSelect').addEventListener('change', initGrid);
        document.getElementById('techniqueSelect').addEventListener('change', () => { initGrid(); draw(); });
        document.getElementById('templateSelect').addEventListener('change', (e) => applyTemplate(e.target.value));

        document.getElementById('btnPencil').onclick = () => setTool('pencil', 'btnPencil');
        document.getElementById('btnBucket').onclick = () => setTool('bucket', 'btnBucket');
        document.getElementById('btnEraser').onclick = () => setTool('eraser', 'btnEraser');
        document.getElementById('btnSelect').onclick = () => setTool('select', 'btnSelect');
        document.getElementById('btnCopy').onclick = copySelectedArea;
        document.getElementById('btnPaste').onclick = () => setTool('paste', 'btnPaste');
        
        document.getElementById('btnMirrorH').onclick = () => {
            mirrorH = !mirrorH;
            document.getElementById('btnMirrorH').classList.toggle('mirror-active', mirrorH);
        };

        document.getElementById('btnMirrorV').onclick = () => {
            mirrorV = !mirrorV;
            document.getElementById('btnMirrorV').classList.toggle('mirror-active', mirrorV);
        };

        document.getElementById('btnSaveDesign').onclick = saveDesign;

        document.getElementById('btnClear').onclick = () => { 
            grid = Array(rows).fill(null).map(() => Array(cols).fill(null)); 
            selectionStart = null;
            selectionEnd = null;
            draw(); 
            updateCalculations(); 
        };

        function setTool(tool, btnId) {
            currentTool = tool;
            document.querySelectorAll('.tools-grid button').forEach(b => b.classList.remove('tool-active'));
            if(btnId) document.getElementById(btnId).classList.add('tool-active');
            if(tool !== 'select' && tool !== 'paste') {
                selectionStart = null;
                selectionEnd = null;
                draw();
            }
        }

        document.getElementById('btnSendWhatsapp').onclick = () => {
            const product = document.getElementById('productSelect').options[document.getElementById('productSelect').selectedIndex].text;
            const beads = document.getElementById('totalBeads').textContent;
            const price = document.getElementById('totalPrice').textContent;

            const text = `¡Hola! Quisiera realizar el siguiente pedido personalizado:%0A%0A` +
                         `📌 *Producto:* ${product}%0A` +
                         `🧩 *Total Cuentas:* ${beads}%0A` +
                         `💰 *Precio Estimado:* ${price}%0A%0A` +
                         `Te adjunto el diseño dibujado desde la web.`;

            window.open(`https://api.whatsapp.com/send?phone=5491100000000&text=${text}`, '_blank');
        };

        renderPalette();
        renderSavedDesigns();
        initGrid();
    </script>
</body>
</html>
